name: macro-note

on:
  schedule:
    # 20:30 UTC = 06:30 AEST (UTC+10) on Mon-Fri. Day-of-week is UTC: 0-4 (Sun-Thu
    # UTC) is Mon-Fri AEST, since AEST is 10 hours ahead. GitHub Actions cron is
    # UTC-only with no DST awareness, so during AEDT (UTC+11, roughly Oct-Apr) this
    # fires at 07:30 local instead of 06:30 -- a known, accepted limitation of
    # GitHub Actions scheduling, not worth maintaining two swapped schedules for.
    - cron: '30 20 * * 0-4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the pipeline without committing, publishing, or redeploying docs'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      # data/ is gitignored (never committed -- see CLAUDE.md) and this runner starts
      # from a fresh checkout every time, so this cache is the only cross-run
      # persistence the store has. Without it, "fall back to the last stored value"
      # would have nothing to fall back to on a fetch failure. restore-keys with a
      # shared prefix always restores the most recent available cache and saves a
      # new one under the run-specific key, growing forward run over run.
      - name: Restore observation store cache
        uses: actions/cache@v4
        with:
          path: data
          key: macro-note-data-${{ github.run_id }}
          restore-keys: |
            macro-note-data-

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: uv run python -m apps.macro_note.main

      - name: Upload rendered note (dry run only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: macro-note-dry-run
          path: docs/notes/*.md

      # main is protected by a ruleset requiring a PR plus a passing "ci" status
      # check -- a direct `git push` to main (as this step did before) is rejected
      # outright (GH013). The fix isn't a branch-protection bypass: it's routing the
      # bot through the same PR-plus-CI path a human push would take. That requires
      # a real, non-GITHUB_TOKEN identity for the push and PR-open specifically,
      # because GitHub deliberately does not let events triggered by the ephemeral
      # GITHUB_TOKEN fire other workflows' push/pull_request triggers (the same
      # recursion guard "Trigger docs redeploy" below already works around) -- with
      # GITHUB_TOKEN alone, ci.yml's pull_request trigger would never fire on this
      # PR, the required "ci" check would never report, and the PR would block
      # forever. MACRO_NOTE_PUBLISH_PAT is scoped to this repo only (Contents RW,
      # Pull requests RW, nothing else) and exists solely to be a real identity for
      # this push and PR-open. Expires 2027-08-06. If this step starts failing with
      # "Bad credentials" / "Authentication failed" -- note the pipeline itself
      # already ran clean by this point (fetch/narrative/guard all passed) -- this
      # token has expired. Regenerate at
      # https://github.com/settings/personal-access-tokens/new with the same scope
      # and update the MACRO_NOTE_PUBLISH_PAT secret; see CLAUDE.md Sec.10.
      - name: Push note to a branch and open PR
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        id: publish_pr
        env:
          GH_TOKEN: ${{ secrets.MACRO_NOTE_PUBLISH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NOTE_DATE=$(date -u +%F)
          BRANCH="automated/note-${NOTE_DATE}-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add docs/notes/
          if git diff --staged --quiet; then
            echo "No note changes to publish."
            exit 0
          fi
          git commit -m "docs(macro-note): publish note for ${NOTE_DATE}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/${BRANCH}"
          PR_URL=$(gh pr create --title "docs(macro-note): publish note for ${NOTE_DATE}" \
            --body "Automated publish for ${NOTE_DATE}." --base main --head "$BRANCH")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      # The "ci" check that fired above is real -- triggered by the PAT-authored PR,
      # not skipped or bypassed -- so waiting for it here and merging only once it
      # passes satisfies the ruleset on its own terms. This step deliberately uses
      # the default GITHUB_TOKEN, not the PAT: merging a PR that already satisfies
      # every required rule needs no special identity or bypass.
      - name: Wait for CI and merge
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.publish_pr.outputs.pr_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL="${{ steps.publish_pr.outputs.pr_url }}"
          # `gh pr checks --watch` errors out immediately with "no checks reported"
          # if called before any check has registered on the PR, rather than
          # waiting for one to appear -- observed live on 2026-08-06: ci.yml's
          # pull_request trigger (fired by this PR's PAT-authored open, not
          # GITHUB_TOKEN) took ~7s to register a check, and --watch lost that race
          # every time. `gh pr view` is exit-0 and valid JSON regardless of check
          # count (unlike `gh pr checks`, confirmed against a disposable test PR),
          # so poll it until at least one check exists before handing off to
          # --watch. 30 attempts * 5s = 150s ceiling, ~20x the observed real delay.
          ATTEMPTS=0
          MAX_ATTEMPTS=30
          until [ "$(gh pr view "$PR_URL" --json statusCheckRollup --jq '.statusCheckRollup | length')" -gt 0 ]; do
            ATTEMPTS=$((ATTEMPTS + 1))
            if [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; then
              echo "No checks registered on $PR_URL after $((MAX_ATTEMPTS * 5))s -- giving up."
              exit 1
            fi
            sleep 5
          done
          gh pr checks "$PR_URL" --watch --fail-fast
          gh pr merge "$PR_URL" --squash --delete-branch

      # GITHUB_TOKEN-authenticated pushes deliberately don't trigger other workflows'
      # push events (a GitHub Actions safety feature against trigger loops), so
      # docs.yml's own push/paths trigger won't fire on its own -- it has to be
      # dispatched explicitly. docs.yml already supports workflow_dispatch. This
      # holds even for the merge above: it's still a GITHUB_TOKEN-authored event.
      - name: Trigger docs redeploy
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main

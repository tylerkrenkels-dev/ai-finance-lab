[project]
name = "ai-finance-lab"
version = "0.1.0"
description = "Applied AI systems for financial research: automated macro notes, filings intelligence, and deal analytics."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.120.2",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "yfinance>=1.5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "apps"]

[dependency-groups]
dev = [
    "hatchling>=1.31.0",
    "mkdocs-material>=9.7.7",
    "mypy>=2.3.0",
    "pandas>=3.0.5",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests touching multiple components",
    "network: tests that make real network calls, excluded from CI",
]

[tool.coverage.run]
source = ["core", "apps"]
